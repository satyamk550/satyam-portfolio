<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Satyam Kumar – Portfolio</title>
    <!-- External Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #2a3cf0;
            --ink: #f6f4ff;
            --muted: #c9cdff;
            --accent: #ffd84d;
            --accent-ink: #1b1b3a;
            --line: rgba(246, 244, 255, .35);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #141a8f;
                --ink: #f1f0ff;
                --muted: #b4b9f5;
                --accent: #ffd84d;
                --accent-ink: #14143a;
                --line: rgba(241, 240, 255, .3);
            }
        }

        :root[data-theme="dark"] {
            --bg: #141a8f;
            --ink: #f1f0ff;
            --muted: #b4b9f5;
            --accent: #ffd84d;
            --accent-ink: #14143a;
            --line: rgba(241, 240, 255, .3);
        }

        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        a {
            color: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .hero {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(20px, 4vw, 48px);
            overflow: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-size: 1.05rem;
        }

        nav .links {
            display: flex;
            gap: clamp(14px, 3vw, 32px);
        }

        nav a {
            text-decoration: none;
            padding: 4px 0;
            border-bottom: 1.5px solid transparent;
            transition: border-color .2s;
        }

        nav a:hover {
            border-color: var(--ink);
        }

        .logo {
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .main {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 32px;
            padding: clamp(24px, 6vh, 64px) 0;
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: clamp(3.4rem, 17vw, 14rem);
            line-height: .86;
            letter-spacing: -.045em;
            font-variation-settings: "opsz" 96;
        }

        h1 span {
            display: inline-block;
            transition: font-weight .25s, transform .25s;
            font-weight: 800;
        }

        h1 span:hover {
            font-weight: 300;
            transform: translateY(-.04em);
        }

        .line2 {
            display: block;
            color: var(--accent);
        }

        .portrait {
            width: clamp(130px, 19vw, 260px);
            aspect-ratio: 3/4;
            border-radius: 999px 999px 24px 24px;
            background: var(--accent);
            position: relative;
            overflow: hidden;
            flex: none;
        }

        .portrait::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 26%;
            width: 38%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--accent-ink);
            transform: translateX(-50%);
        }

        .portrait::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -18%;
            width: 78%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--accent-ink);
            transform: translateX(-50%);
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 24px;
            flex-wrap: wrap;
            border-top: 1.5px solid var(--line);
            padding-top: 24px;
        }

        .bottom p {
            margin: 0;
            max-width: 34ch;
            font-size: clamp(1.05rem, 1.6vw, 1.35rem);
            line-height: 1.4;
            color: var(--muted);
        }

        .bottom p strong {
            color: var(--ink);
            font-weight: 600;
        }

        .cta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 14px 26px;
            border-radius: 999px;
            border: 1.5px solid var(--ink);
            transition: background .2s, color .2s, transform .2s;
        }

        .btn.primary {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:not(.primary):hover {
            background: var(--ink);
            color: var(--bg);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .95rem;
            color: var(--muted);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #5dffa0;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(93, 255, 160, .6); }
            100% { box-shadow: 0 0 0 12px rgba(93, 255, 160, 0); }
        }

        @media (max-width: 700px) {
            .main { grid-template-columns: 1fr; }
            .portrait { order: -1; width: 120px; }
            nav .links a:nth-child(n+3) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="hero">
        <nav>
            <span class="logo">Satyam Kumar</span>
            <div class="links">
                <a href="https://github.com/satyamk550" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/SatyamKumar" target="_blank" rel="noopener">LinkedIn</a>
                <a href="mailto:satyamkumar42143@gmail.com">Contact</a>
            </div>
        </nav>

        <div class="main">
            <h1 aria-label="Satyam Kumar">
                <span>S</span><span>a</span><span>t</span><span>y</span><span>a</span><span>m</span>
                <span class="line2" aria-hidden="true">
                    <span>K</span><span>u</span><span>m</span><span>a</span><span>r</span>
                </span>
            </h1>
            <div class="portrait" role="img" aria-label="Portrait placeholder"></div>
        </div>

        <div class="bottom">
            <p><strong>Blockchain and Web3 developer.</strong> B.Tech student at CGC University building smart contracts, dApps and secure web projects with Solidity, Ethereum and JavaScript.</p>
            <div class="cta">
                <span class="status"><i class="dot"></i>Open for internships</span>
                <a class="btn primary" href="https://github.com/satyamk550" target="_blank" rel="noopener">View projects</a>
                <a class="btn" href="mailto:satyamkumar42143@gmail.com">Get in touch</a>
            </div>
        </div>
    </header>
</body>
</html>
